<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" role="img" aria-label="CuteDisplay proposed ELEGOO 830-point breadboard with ESP32-S3 brain and LILYGO T-Display-C5 face. S3 connects to INMP441 microphone, MAX98357A amplifier and UART to LILYGO. Camera omitted. GPIO numbers not yet assigned; use labeled signals and common ground.">
