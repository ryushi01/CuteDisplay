<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Proposed power-only Option 1: USB C power into LILYGO T-Display-C5, 5V header to Freenove ESP32-S3 5V input, ground to ground. Do not connect until C5 five-volt header power-path current rating is verified. No UART or audio connected.">
