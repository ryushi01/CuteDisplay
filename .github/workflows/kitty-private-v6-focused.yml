name: Kitty private V6 focused guard tests
on:
  pull_request:
    paths:
      - 'server/kitty_*v6.py'
      - 'server/kitty_sd_semantic_index.py'
      - 'server/test_kitty_*v6.py'
      - '.github/workflows/kitty-private-v6-focused.yml'
permissions:
  contents: read
jobs:
  private-memory-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Minimal local dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'cryptography>=42,<47'
      - name: Separate private boundary tests
        env:
          PYTHONPATH: server
        run: |
          timeout 40s python -m unittest -v \
            server.test_kitty_semantic_authorization_v6 \
            server.test_kitty_private_sd_boundary_v6 \
            server.test_kitty_attested_live_call_v6 \
            server.test_kitty_semantic_async_client_v6 \
            server.test_kitty_owner_sd_receipts_v6 \
            server.test_kitty_owner_voice_auth_issuer_v6 \
            server.test_kitty_owner_voice_auth_integration_v6
