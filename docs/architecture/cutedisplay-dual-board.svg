<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-label="CuteDisplay planned two-board architecture: iPhone connects by BLE to Freenove ESP32-S3 brain, which connects over Wi-Fi to OpenAI or Ollama server and wired UART to LILYGO T-Display C5. INMP441 microphone and MAX98357A amplifier with speaker connect to S3; onboard camera lives on S3.">
