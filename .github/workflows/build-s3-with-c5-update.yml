name: Build combined S3 + C5 firmware

on:
  workflow_dispatch:
  push:
    branches: [main, feature/s3-ai-streaming, feature/wav-only-baseline-candidate, feature/c5-unicode-font-coverage, feature/c5-color-emoji-v16, feature/uart-ota-fast-v17, feature/c5-uniform-chat-font-v18, feature/c5-v19-selective-font-fix, feature/c5-v20-latin-glyph-priority, feature/c5-v21-latin-composed-accents, feature/realtime-call-c5v21, feature/realtime-kitty-fullscreen-expressions, feature/idle-ai-memory-consolidation, feature/semantic-sd-facts, feature/dual-core-scheduling, feature/memory-v2-lifecycle, feature/kitty-temporal-awareness]
    paths:
      - ".github/workflows/build-s3-with-c5-update.yml"
      - "tools/build_s3_with_c5_update.sh"
      - "tools/package_c5_firmware.py"
      - "tools/generate_c5_japanese_font.py"
      - "firmware/CuteDisplay/**"
      - "firmware/CuteDisplayBrain/**"
      - "ios/CuteDisplay/**"
      - "docs/INSTALL_REALTIME_COMPLETE.md"
      - "docs/REALTIME_I2S_AUDIO_EXPERIMENT.md"
      - "docs/REALTIME_KITTY_FACE_V23.md"
      - "docs/REALTIME_KITTY_EXPRESSION_TOOL.md"
      - "server/**"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out CuteDisplay project
        uses: actions/checkout@v4

      - name: Verify opt-in Kitty live memory refresh gateway patch
        run: python3 server/test_patch_openwebui_memory_refresh.py

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # Reuse the expensive ESP32 core/toolchain downloads between workflow runs.
      - name: Cache ESP32 Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
          key: esp32-arduino-3.3.12-ubuntu24-v1

      - name: Install Espressif ESP32 core 3.3.12
        shell: bash
        run: |
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Install MP3 decoder library for Kitty TTS
        shell: bash
        run: |
          arduino-cli lib install "ESP8266Audio@2.4.1"

      - name: Install WebSocket library for direct Open WebUI Call Mode
        run: arduino-cli lib install "WebSockets@2.7.2"

      - name: Show available C5 and S3 board menu options
        shell: bash
        run: |
          arduino-cli board details --fqbn esp32:esp32:esp32c5
          arduino-cli board details --fqbn esp32:esp32:esp32s3

      - name: Install CJK glyph generator dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk python3-pil

      - name: Verify S3 Kitty expression call handshake
        shell: bash
        run: |
          set -euo pipefail
          FILE=firmware/CuteDisplayBrain/BrainRealtimeDirect.h
          grep -Fq 'cJSON_AddStringToObject(event,"type","bridge.animation.respond")' "$FILE"
          grep -Fq 'if(!bridgeAnimationRespond(animationResponseId))' "$FILE"
          ! grep -Fq 'bridgeRespond("response_id",animationResponseId)' "$FILE"
          grep -Fq 'cJSON_AddBoolToObject(auth,"kitty_expressions",true)' "$FILE"

      - name: Compile current C5 and bundled S3 firmware
        shell: bash
        run: bash tools/build_s3_with_c5_update.sh

      - name: Publish ready-to-upload S3 project and binaries
        uses: actions/upload-artifact@v4
        with:
          name: CuteDisplay-CombinedFirmware
          path: release/
          if-no-files-found: error
          retention-days: 90
