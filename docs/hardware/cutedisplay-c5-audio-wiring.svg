<path d="M 535 473 H 650 V 555 H 816" stroke="#c84a4a" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M 535 506 H 670 V 585 H 816" stroke="#d6a31c" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M 535 539 H 690 V 617 H 816" stroke="#279f65" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M 535 571 H 715 V 648 H 816" stroke="#e3872a" stroke-width="6" fill="none" stroke-linecap="round"/>
<text x="554" y="265" font-family="Arial" font-size="15" fill="#9f3142">3.3 V</text>
<text x="554" y="302" font-family="Arial" font-size="15" fill="#9a6b07">BCLK</text>
<text x="554" y="341" font-family="Arial" font-size="15" fill="#176b43">WS</text>
<text x="554" y="379" font-family="Arial" font-size="15" fill="#245fa2">Mic SD</text>
<text x="552" y="492" font-family="Arial" font-size="15" fill="#9f3142">5 V*</text>
<text x="552" y="525" font-family="Arial" font-size="15" fill="#9a6b07">BCLK (shared)</text>
<text x="552" y="560" font-family="Arial" font-size="15" fill="#176b43">WS (shared)</text>
<text x="552" y="595" font-family="Arial" font-size="15" fill="#b86e20">Amp DIN</text>
<rect x="55" y="790" width="1290" height="126" rx="18" fill="#fff7ed" stroke="#edbc75" stroke-width="2"/>
<text x="79" y="824" font-family="Arial" font-size="21" font-weight="bold" fill="#7c4b0a">Safety and assembly</text>
<text x="79" y="853" font-family="Arial" font-size="18" fill="#654c31">• USB-C powers the LILYGO. *Use its 5 V output for the amplifier only after checking the available current.</text>
<text x="79" y="880" font-family="Arial" font-size="18" fill="#654c31">• Common GND is required (not drawn as extra crossing wires). Never join 3V3 with 5V; never ground SPK−.</text>
<text x="79" y="906" font-family="Arial" font-size="16" fill="#785c3d">Conceptual schematic, not exact breadboard holes. Follow the full pin table in docs/hardware/lilygo-c5-audio-breadboard.md.</text>
</svg>