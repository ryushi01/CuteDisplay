name: Check Realtime gateway and iPhone pairing source

on:
  workflow_dispatch:
  push:
    branches: [feature/realtime-call-c5v21]
    paths:
      - 'gateway/**'
      - 'server/**'
      - 'ios/CuteDisplay/**'
      - '.github/workflows/check-realtime-gateway.yml'

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WebSocket client/server
        run: python -m pip install 'websockets>=14,<17'
      - name: Syntax check
        run: python -m compileall -q gateway
      - name: Unit tests — no accounts or network needed
        run: python -m unittest discover -s gateway -p 'test_*.py' -v
      - name: Ensure no credentials accidentally committed
        run: |
          test ! -e gateway/private-config.json
          ! grep -R -E 'shana\.deroose@gmail\.com|sk-[A-Za-z0-9]{32}' gateway/ --include='*.py'

  ios-parse:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Parse SwiftUI source (syntax only; no Xcode project in repository)
        run: |
          xcrun swiftc -frontend -parse ios/CuteDisplay/ContentView.swift
          xcrun swiftc -frontend -parse ios/CuteDisplay/BluetoothManager.swift

  server-auth-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile direct WebUI realtime auth patch
        run: python -m py_compile server/patch_openwebui_realtime_api_key.py
      - name: Validate existing-Compose safe deployment and rollback script shell syntax
        run: bash -n server/deploy_existing_openwebui.sh
      - name: Regression — root-owned Compose backup must not block unprivileged chmod
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'sudo rm -rf "$scratch"' EXIT
          sudo install -m 600 /dev/null "$scratch/docker-compose.yaml"
          touch "$scratch/candidate.yaml" "$scratch/rollback.yaml"
          chmod 600 "$scratch/candidate.yaml" "$scratch/rollback.yaml"
          test "$(stat -c '%a' "$scratch/candidate.yaml")" = 600
          test "$(sudo stat -c '%a' "$scratch/docker-compose.yaml")" = 600
          grep -Fq 'chmod 600 "$BACKUP/candidate.yaml" "$BACKUP/rollback.yaml"' server/deploy_existing_openwebui.sh
          ! grep -Fq 'chmod 600 "$BACKUP"/*.yaml' server/deploy_existing_openwebui.sh
      - name: Test version guard and API-key permission delegation
        run: python -m unittest discover -s server -p 'test_*.py' -v
      - name: Compile patch against actual upstream Open WebUI source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/owui-src/backend/open_webui/routers/audio
          curl --fail --show-error --silent --location \
            https://raw.githubusercontent.com/open-webui/open-webui/main/backend/open_webui/routers/audio/realtime.py \
            -o /tmp/owui-src/backend/open_webui/routers/audio/realtime.py
          python server/patch_openwebui_realtime_api_key.py --source-root /tmp/owui-src --check
          python server/patch_openwebui_realtime_api_key.py --source-root /tmp/owui-src --apply
          python -m py_compile /tmp/owui-src/backend/open_webui/routers/audio/realtime.py
