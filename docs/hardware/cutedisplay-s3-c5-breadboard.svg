<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-label="CuteDisplay ESP32 S3 brain and LILYGO C5 face breadboard proposal. S3 GPIO41 shared BCLK, GPIO42 shared WS, GPIO1 mic data, GPIO2 amplifier data, GPIO47 UART TX to C5 GPIO1 RX, S3 GPIO21 UART RX from C5 GPIO6 TX; ground common. Camera omitted.">
<rect width="1600" height="1180" fill="#f8fafc"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="55" y="57" font-size="39" font-weight="700" fill="#193454">CuteDisplay • Dual-board breadboard pin plan</text>
<text x="55" y="94" font-size="22" fill="#536980">ESP32-S3 brain + LILYGO C5 face + I²S microphone/amplifier • NO camera wiring</text>
<rect x="55" y="120" width="1490" height="793" rx="23" fill="#ffffff" stroke="#bccddd" stroke-width="3"/>
<rect x="76" y="141" width="1448" height="740" rx="18" fill="#f0f3f9" stroke="#ccd6e2"/>
<path d="M98 175 H1502 M98 195 H1502" fill="none" stroke-width="5" stroke="#df7781"/>
<path d="M98 208 H1502" fill="none" stroke-width="5" stroke="#658fcb"/>
<path d="M98 828 H1502" fill="none" stroke-width="5" stroke="#df7781"/>
<path d="M98 851 H1502" fill="none" stroke-width="5" stroke="#658fcb"/>
<text x="104" y="170" font-size="16" fill="#ac4552">+ (example power rail, supply verified before use)</text>
<text x="104" y="241" font-size="16" fill="#3d70ae">− (common GND, verify continuity)</text>
<path d="M100 519 H1502" stroke="#b7c4d5" stroke-width="17" stroke-dasharray="3 11" opacity=".7"/>
<text x="105" y="500" font-size="17" fill="#72859b">breadboard center channel · schematic layout, not exact hole positions</text>
<!-- primary boards -->
<rect x="115" y="292" width="590" height="445" rx="20" fill="#e8f8ef" stroke="#269367" stroke-width="4"/>
<text x="147" y="337" font-size="31" font-weight="700" fill="#156648">FREENOVE ESP32-S3 (BRAIN)</text>
<text x="147" y="366" font-size="18" fill="#427361">BLE first setup + Wi-Fi AI backend</text>
<rect x="148" y="389" width="520" height="316" rx="13" fill="#fff" stroke="#aad6c0" stroke-width="2"/>
<text x="172" y="423" font-size="20" font-weight="700" fill="#275b47">Pin labels • candidate exposed GPIOs</text>
<text x="172" y="462" font-size="20" fill="#b37710">GPIO41  →  I²S BCLK (shared)</text>
<text x="172" y="501" font-size="20" fill="#1b8771">GPIO42  →  I²S WS/LRC (shared)</text>
<text x="172" y="540" font-size="20" fill="#2768bb">GPIO1    ←  MIC SD (input)</text>
<text x="172" y="579" font-size="20" fill="#9e4892">GPIO2    →  AMP DIN (output)</text>
<text x="172" y="626" font-size="20" fill="#bf6427">GPIO47 TX →  C5 GPIO1 RX</text>
<text x="172" y="662" font-size="20" fill="#a73762">GPIO21 RX ←  C5 GPIO6 TX</text>
<rect x="946" y="329" width="533" height="371" rx="20" fill="#fff0f5" stroke="#bd5484" stroke-width="4"/>
<text x="976" y="371" font-size="30" font-weight="700" fill="#903b66">LILYGO T-DISPLAY-C5</text>
<rect x="982" y="393" width="457" height="133" rx="14" fill="#1f334d"/>
<text x="1013" y="436" font-size="27" fill="#fff">Hello! Kitty ♡</text>
<text x="1013" y="469" font-size="18" fill="#cfdef0">Mascots · AI response text</text>
<text x="1013" y="495" font-size="18" fill="#cfdef0">Battery · local animation loop</text>
<text x="982" y="566" font-size="22" fill="#b05a21">GPIO1 RX ← S3 GPIO47 TX</text>
<text x="982" y="603" font-size="22" fill="#aa315c">GPIO6 TX → S3 GPIO21 RX</text>
<text x="982" y="641" font-size="22" fill="#526172">GND ↔ S3 GND</text>
<!-- only 3 interboard wires, separate horizontal tracks -->
<path d="M706 626 H772 V564 H944" fill="none" stroke="#d98332" stroke-width="7" stroke-linecap="round"/>
<path d="M944 603 H841 V663 H706" fill="none" stroke="#d44878" stroke-width="7" stroke-linecap="round"/>
<path d="M706 700 H807 V737 H944 V642" fill="none" stroke="#4d5e73" stroke-width="7" stroke-linecap="round"/>
<text x="742" y="551" font-size="16" font-weight="700" fill="#b36921">S3 TX → C5 RX</text>
<text x="754" y="689" font-size="16" font-weight="700" fill="#a93662">C5 TX → S3 RX</text>
<text x="838" y="757" font-size="16" font-weight="700" fill="#46576b">common GND</text>
<rect x="112" y="765" width="1385" height="39" rx="10" fill="#e1e7f0"/>
<text x="135" y="791" font-size="19" fill="#4a5e76">Separate USB power for S3 and C5 during initial tests; link GND, never bridge two 5V or 3V3 outputs.</text>
<!-- audio module boxes below board with unambiguous signal net tables -->
<rect x="78" y="945" width="442" height="180" rx="16" fill="#e8f7ff" stroke="#82b5d4" stroke-width="3"/>
<text x="102" y="983" font-size="26" font-weight="700" fill="#1a597b">INMP441 MICROPHONE</text>
<text x="102" y="1018" font-size="20" fill="#a06d0c">SCK ← S3 GPIO41   •   WS ← GPIO42</text>
<text x="102" y="1052" font-size="20" fill="#2968b0">SD → S3 GPIO1</text>
<text x="102" y="1085" font-size="20" fill="#465b6c">VDD = 3V3  •  GND = GND  •  L/R = GND</text>
<rect x="540" y="945" width="528" height="180" rx="16" fill="#fff1da" stroke="#d8b36f" stroke-width="3"/>
<text x="565" y="983" font-size="26" font-weight="700" fill="#845a20">MAX98357A AMPLIFIER</text>
<text x="565" y="1018" font-size="20" fill="#92650c">BCLK ← S3 GPIO41  •  LRC ← GPIO42</text>
<text x="565" y="1052" font-size="20" fill="#974888">DIN ← S3 GPIO2</text>
<text x="565" y="1085" font-size="20" fill="#615748">VIN = verified 5V supply  •  GND = GND</text>
<rect x="1088" y="945" width="412" height="180" rx="16" fill="#f1eefe" stroke="#a7a0d8" stroke-width="3"/>
<text x="1112" y="983" font-size="26" font-weight="700" fill="#5c5098">8Ω / 1W SPEAKER</text>
<text x="1112" y="1018" font-size="20" fill="#655a98">SPK+ ← amplifier SPK+</text>
<text x="1112" y="1052" font-size="20" fill="#655a98">SPK− ← amplifier SPK−</text>
<text x="1112" y="1085" font-size="19" fill="#8b4450">Never connect SPK− to GND</text>
<text x="78" y="1152" font-size="17" fill="#596b7e">UART pins: each board passed standalone loopback; S3-C5 link NOT yet verified. Graphic is not physical hole placement.</text>
</g></svg>