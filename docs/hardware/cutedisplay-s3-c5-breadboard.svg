<path d="M90 474 H1410" stroke="#b3bdca" stroke-width="18" stroke-dasharray="3 9" opacity=".55"/>
<text x="103" y="460" fill="#8090a1" font-size="16">centre trench</text>
<!-- S3 board occupies left zone, LILYGO right; connector faces remain recognizable -->
<rect x="139" y="283" width="490" height="337" rx="21" fill="#e9f8f0" stroke="#238765" stroke-width="4"/>
<text x="167" y="324" font-size="29" font-weight="700" fill="#146246">Freenove ESP32-S3 Brain</text>
<text x="167" y="355" font-size="18" fill="#476f5a">BLE + Wi-Fi + future audio / AI bridge</text>
<rect x="169" y="384" width="420" height="72" rx="10" fill="#264e48"/>
<text x="193" y="414" font-size="21" fill="#fff">USB-C power (separate supply)</text>
<text x="193" y="441" font-size="17" fill="#c2e8d4">Camera pin reservations to verify</text>
<rect x="169" y="477" width="420" height="121" rx="12" fill="#fff" stroke="#a9d4be"/>
<text x="189" y="506" font-size="18" font-weight="700" fill="#165d43">Future S3 header signals (pins TBD)</text>
<text x="189" y="533" font-size="18" fill="#9d6318">I²S BCLK + WS  →  mic and amp</text>
<text x="189" y="558" font-size="18" fill="#227abb">MIC DIN  ←  INMP441 SD</text>
<text x="189" y="582" font-size="18" fill="#b05b72">AMP DOUT  →  MAX98357A DIN</text>
<rect x="844" y="283" width="476" height="337" rx="21" fill="#fff1f7" stroke="#c85b90" stroke-width="4"/>
