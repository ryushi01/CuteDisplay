name: Validate realtime voice diagnostic scripts

on:
  push:
    branches:
      - feature/realtime-call-c5v21
    paths:
      - 'tools/probe_openwebui_realtime.py'
      - 'tools/probe_openwebui_realtime_login.py'
      - 'tools/realtime_audio_smoke.py'
      - 'tools/realtime_two_turn_smoke.py'
      - 'tools/realtime_model_delegation_smoke.py'
      - '.github/workflows/validate-realtime-tools.yml'
  workflow_dispatch:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile diagnostic scripts
        run: |
          python -m py_compile \
            tools/probe_openwebui_realtime.py \
            tools/probe_openwebui_realtime_login.py \
            tools/realtime_audio_smoke.py \
            tools/realtime_two_turn_smoke.py \
            tools/realtime_model_delegation_smoke.py
      - name: Verify no credentials baked into diagnostics
        run: |
          ! grep -R -E 'shana\.deroose@gmail\.com|sk-[A-Za-z0-9]{16,}' \
             tools/probe_openwebui_realtime.py \
             tools/probe_openwebui_realtime_login.py \
             tools/realtime_audio_smoke.py \
             tools/realtime_two_turn_smoke.py \
             tools/realtime_model_delegation_smoke.py
