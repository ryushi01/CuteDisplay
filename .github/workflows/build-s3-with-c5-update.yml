name: Build combined S3 + C5 firmware

on:
  workflow_dispatch:
  push:
    branches: [main, feature/s3-ai-streaming, feature/wav-only-baseline-candidate, feature/c5-unicode-font-coverage, feature/c5-color-emoji-v16, feature/uart-ota-fast-v17, feature/c5-uniform-chat-font-v18, feature/c5-v19-selective-font-fix, feature/c5-v20-latin-glyph-priority, feature/c5-v21-latin-composed-accents, feature/realtime-call-c5v21, feature/realtime-kitty-fullscreen-expressions, feature/idle-ai-memory-consolidation, feature/semantic-sd-facts, feature/dual-core-scheduling, feature/memory-v2-lifecycle, feature/kitty-temporal-awareness, feature/kitty-sd-brain-v3, feature/kitty-sd-brain-v4-persona, feature/kitty-memory-v5-fullstack, feature/kitty-semantic-v6-cpu]
    paths:
      - ".github/workflows/build-s3-with-c5-update.yml"
      - "tools/build_s3_with_c5_update.sh"
      - "tools/package_c5_firmware.py"
      - "tools/generate_c5_japanese_font.py"
      - "firmware/CuteDisplay/**"
      - "firmware/CuteDisplayBrain/**"
      - "ios/CuteDisplay/**"
      - "docs/INSTALL_REALTIME_COMPLETE.md"
      - "docs/REALTIME_I2S_AUDIO_EXPERIMENT.md"
      - "docs/REALTIME_KITTY_FACE_V23.md"
      - "docs/REALTIME_KITTY_EXPRESSION_TOOL.md"
      - "server/**"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out CuteDisplay project
        uses: actions/checkout@v4

      - name: Verify opt-in Kitty live memory refresh gateway patch
        run: python3 server/test_patch_openwebui_memory_refresh.py

      - name: Compile optional server memory tools and run storage regression tests
        run: |
          python3 -m py_compile server/kitty_memory_service.py server/kitty_semantic_authorization_v6.py server/kitty_calendar.py server/kitty_sd_semantic_index.py server/patch_openwebui_memory_refresh.py
          PYTHONPATH=server python3 -m unittest server.test_kitty_memory_service server.test_kitty_semantic_authorization_v6 server.test_kitty_memory_context_v6 server.test_kitty_semantic_async_client_v6 -v
          python3 server/test_patch_openwebui_memory_refresh.py

      - name: Verify read-only live Ubuntu readiness preflight
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_live_readiness_v6 -v

      - name: Verify read-only owner semantic service patch compatibility plan
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_owner_guard_plan_v6 -v

      - name: Verify single-command private semantic owner guard deployment and rollback
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_owner_guard_deploy_v6 -v

      - name: Verify signed single-call speaker attestation and rolling continuity
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_attested_live_call_v6 server.test_kitty_attested_turn_context_v6 -v

      - name: Inspect read-only gateway turn shape without exposing private source
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_gateway_turn_shape_v6 -v

      - name: Verify no-VAD upstream-only attested gateway event adapter
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_gateway_turn_adapter_v6 -v

      - name: Verify secure owner-voice adaptive learning from confirmed turns
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_voice_adaptation_policy_v6 server.test_kitty_voice_learning_v6 server.test_kitty_owner_voice_postcall_v6 server.test_kitty_owner_voice_profile_store_v6 server.test_kitty_voice_adaptive_scoring_v6 server.test_kitty_xvector_adaptive_candidates_v6 server.test_kitty_xvector_adaptive_store_v6 server.test_kitty_owner_voice_review_issuer_v6 server.test_kitty_owner_voice_review_workflow_v6 server.test_kitty_voice_familiarity_hints_v6 -v

      - name: Test read-only single-file bind gateway deployment with inode and rollback guards
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_gateway_bind_rollout_v6 -v

      - name: Diagnose gateway bind mount and atomic replace without reading private source
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_gateway_atomic_mount_probe_v6 -v

      - name: Verify one-command gateway rollout protection and rollback logic
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_gateway_passive_rollout_v6 -v

      - name: Diagnose custom provider decode layouts without exposing private gateway source
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_gateway_decode_preflight_v6 -v

      - name: Test guarded upstream provider decode hook and audio forwarding
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_gateway_decode_hook_patch_v6 -v

      - name: Test optional passive gateway bridge
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_passive_turn_bridge_v6 server.test_kitty_gateway_provider_scope_v6 -v

      - name: Verify C5 v39 transparent black conversation captions
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_c5_transparent_caption_v39 -v

      - name: Check speaker attribution and display contracts
        run: |
          python3 -m unittest discover -s server -p 'test_kitty_attribution_pipeline_contract_v6.py' -v
          python3 -m unittest discover -s server -p 'test_kitty_display_contract_v6.py' -v

      - name: Check durable S3 summary journal and privacy contracts
        run: python3 server/test_kitty_sd_summary_journal_contract_v6.py

      - name: Guard accepted S3 heap, BLE and stack diagnostics
        run: python3 server/test_kitty_s3_memory_stability_contract_v6.py

      - name: Verify unverified realtime memory isolation
        run: python3 server/test_kitty_realtime_public_memory_contract_v6.py

      - name: Test speaker-bound private recall and public-memory isolation
        run: |
          PYTHONPATH=server python3 -m unittest \
            server.test_kitty_turn_context_v6 \
            server.test_kitty_memory_context_v6 \
            server.test_kitty_semantic_async_client_v6 \
            server.test_kitty_gateway_speaker_guard_v6 \
            server.test_kitty_live_rolling_context_v6 -v

      - name: Ensure legacy X-vector identity mode cannot authorize an owner
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_xvector_legacy_identity_guard_v6 -v

      - name: Reject voice-probable private recall and validate candidate-only familiarity transport
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_realtime_gateway_observer_v6 server.test_kitty_realtime_speaker_v6 -v

      - name: Test guarded voice safety deployment and rollback
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_v6_voice_stage_deploy -v

      - name: Verify private S3-only sync packaging and public CI credential exclusion
        run: PYTHONPATH=server python3 -m unittest server.test_kitty_private_s3_only_build_v6 -v

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # Reuse the expensive ESP32 core/toolchain downloads between workflow runs.
      - name: Cache ESP32 Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
          key: esp32-arduino-3.3.12-ubuntu24-v1

      - name: Install Espressif ESP32 core 3.3.12
        shell: bash
        run: |
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Install MP3 decoder library for Kitty TTS
        shell: bash
        run: |
          arduino-cli lib install "ESP8266Audio@2.4.1"

      - name: Install WebSocket library for direct Open WebUI Call Mode
        run: arduino-cli lib install "WebSockets@2.7.2"

      - name: Show available C5 and S3 board menu options
        shell: bash
        run: |
          arduino-cli board details --fqbn esp32:esp32:esp32c5
          arduino-cli board details --fqbn esp32:esp32:esp32s3

      - name: Install CJK glyph generator dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk python3-pil

      - name: Verify S3 Kitty expression call handshake
        shell: bash
        run: |
          set -euo pipefail
          FILE=firmware/CuteDisplayBrain/BrainRealtimeDirect.h
          grep -Fq 'cJSON_AddStringToObject(event,"type","bridge.animation.respond")' "$FILE"
          grep -Fq 'if(!bridgeAnimationRespond(animationResponseId))' "$FILE"
          ! grep -Fq 'bridgeRespond("response_id",animationResponseId)' "$FILE"
          grep -Fq 'cJSON_AddBoolToObject(auth,"kitty_expressions",true)' "$FILE"

      - name: Compile current C5 and bundled S3 firmware
        shell: bash
        run: bash tools/build_s3_with_c5_update.sh

      # S3-only app contains the empty CombinedFirmwareImage placeholder.
      # It cannot trigger the working C5 v38 OTA path during S3-only testing.
      - name: Build consolidated S3-only memory and stack candidate
        shell: bash
        run: bash tools/build_s3_only_v6.sh

      - name: Publish S3-only candidate without C5 OTA image
        uses: actions/upload-artifact@v4
        with:
          name: KittyV6-S3Only-NoC5OTA
          path: s3-only-candidate/
          if-no-files-found: error
          retention-days: 90

      - name: Publish ready-to-upload S3 project and binaries
        uses: actions/upload-artifact@v4
        with:
          name: CuteDisplay-CombinedFirmware
          path: release/
          if-no-files-found: error
          retention-days: 90
