<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="CuteDisplay LILYGO T-Display C5 audio breadboard wiring: INMP441 microphone GPIO1, GPIO4, GPIO5; MAX98357A amplifier GPIO1, GPIO4, GPIO6; separate 3.3 V and 5 V rails, common ground, speaker on amplifier outputs">
<rect width="1400" height="960" fill="#f8fafc"/>
<text x="60" y="62" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#142d4e">CuteDisplay — LILYGO C5 audio breadboard</text>
<text x="60" y="99" font-family="Arial, sans-serif" font-size="22" fill="#48627a">ELEGOO 830-point breadboard • current LILYGO-only phase • electrical wiring guide</text>
<rect x="55" y="130" width="1290" height="630" rx="22" fill="#fff" stroke="#cad5e2" stroke-width="2"/>
<rect x="82" y="163" width="455" height="555" rx="18" fill="#eff6ff" stroke="#89b4d8" stroke-width="3"/>
<text x="110" y="199" font-family="Arial" font-size="26" font-weight="bold" fill="#143456">LILYGO T-Display-C5</text>
<text x="110" y="227" font-family="Arial" font-size="18" fill="#45677f">LCD horizontal • USB-C on LEFT</text>
<rect x="114" y="250" width="387" height="126" rx="12" fill="#16283e"/>
<text x="137" y="286" font-family="Arial" font-size="25" fill="#fff">Hello! ♡</text>
<text x="137" y="319" font-family="Arial" font-size="19" fill="#e5edf8">Kitty + battery + BLE</text>
<text x="137" y="352" font-family="Arial" font-size="16" fill="#a5b8ce">Built-in display: no extra wiring</text>
<text x="108" y="411" font-family="Arial" font-size="20" font-weight="bold" fill="#143456">Header connectors</text>
<text x="108" y="444" font-family="Arial" font-size="18" fill="#567086">TOP edge (official left header)</text>
<text x="108" y="475" font-family="Arial" font-size="18" fill="#b04444">3V3</text>
<text x="108" y="508" font-family="Arial" font-size="18" fill="#a36b00">GPIO1 • BCLK</text>
<text x="108" y="542" font-family="Arial" font-size="18" fill="#567086">BOTTOM edge (official right header)</text>
<text x="108" y="575" font-family="Arial" font-size="18" fill="#198057">GPIO4 • WS / LRC</text>
<text x="108" y="608" font-family="Arial" font-size="18" fill="#2762ba">GPIO5 • Mic data</text>
<text x="108" y="641" font-family="Arial" font-size="18" fill="#aa5b1c">GPIO6 • Amp data</text>
<text x="108" y="675" font-family="Arial" font-size="18" fill="#4f6074">GND • shared / 5V • amp only</text>
<rect x="820" y="162" width="492" height="250" rx="18" fill="#effcf5" stroke="#8bcdab" stroke-width="3"/>
<text x="849" y="204" font-family="Arial" font-size="28" font-weight="bold" fill="#176346">INMP441 microphone</text>
<text x="849" y="233" font-family="Arial" font-size="19" fill="#385e4d">Digital I²S input • 3.3 V only</text>
<text x="850" y="273" font-family="Arial" font-size="19" fill="#b04444">VDD ← 3V3</text>
<text x="850" y="304" font-family="Arial" font-size="19" fill="#a36b00">SCK/BCLK ← GPIO1</text>
<text x="850" y="335" font-family="Arial" font-size="19" fill="#198057">WS ← GPIO4</text>
<text x="850" y="366" font-family="Arial" font-size="19" fill="#2762ba">SD/DOUT → GPIO5</text>
<text x="1100" y="273" font-family="Arial" font-size="18" fill="#4f6074">GND → GND</text>
<text x="1100" y="304" font-family="Arial" font-size="18" fill="#4f6074">L/R → GND</text>
<rect x="820" y="443" width="492" height="274" rx="18" fill="#fff8ed" stroke="#e9b86e" stroke-width="3"/>
<text x="849" y="486" font-family="Arial" font-size="28" font-weight="bold" fill="#895115">MAX98357A amplifier</text>
<text x="849" y="517" font-family="Arial" font-size="19" fill="#77603c">Digital I²S output • 5 V supply*</text>
<text x="850" y="556" font-family="Arial" font-size="19" fill="#b04444">VIN ← 5V/VBUS*</text>
<text x="850" y="588" font-family="Arial" font-size="19" fill="#a36b00">BCLK ← GPIO1</text>
<text x="850" y="620" font-family="Arial" font-size="19" fill="#198057">LRC ← GPIO4</text>
<text x="850" y="652" font-family="Arial" font-size="19" fill="#aa5b1c">DIN ← GPIO6</text>
<text x="1100" y="556" font-family="Arial" font-size="18" fill="#4f6074">GND → GND</text>
<text x="1050" y="690" font-family="Arial" font-size="18" fill="#895115">SPK+ / SPK− → 8Ω speaker</text>
<!-- clearly separated connection stripes, conceptual fan-out -->
<text x="568" y="205" font-family="Arial" font-size="18" font-weight="bold" fill="#334155">Signal paths</text>
<path d="M 535 245 H 640 V 270 H 816" stroke="#df5260" stroke-width="6" fill="none" stroke-linecap="round"/>
