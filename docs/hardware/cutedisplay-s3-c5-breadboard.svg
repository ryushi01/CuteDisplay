<g font-size="16" font-weight="700"><text x="656" y="351" fill="#a15c0e">S3 TX → C5 RX</text><text x="650" y="395" fill="#205aa7">C5 TX → S3 RX</text><text x="671" y="474" fill="#424b59">GND ↔ GND</text></g>
<rect x="117" y="785" width="397" height="45" rx="12" fill="#e7f7ff" stroke="#a1c9db"/>
<text x="135" y="815" font-size="18" fill="#165676">INMP441 microphone → S3 I²S RX</text>
<rect x="539" y="785" width="454" height="45" rx="12" fill="#fff3df" stroke="#e3c18a"/>
<text x="554" y="815" font-size="18" fill="#815318">MAX98357A amplifier ← S3 I²S TX</text>
<rect x="1017" y="785" width="355" height="45" rx="12" fill="#f1edff" stroke="#b2a1e0"/>
<text x="1034" y="815" font-size="18" fill="#5a4292">8Ω speaker ← SPK+ / SPK−</text>
<path d="M514 807 H539 M993 807 H1017" stroke="#7c8aa0" stroke-width="4" stroke-dasharray="7 7"/>
<rect x="60" y="865" width="1380" height="116" rx="17" fill="#fff8e8" stroke="#e2c080" stroke-width="2"/>
<text x="87" y="898" font-size="22" font-weight="700" fill="#86571c">Electrical connections and safety</text>
<text x="87" y="925" font-size="18" fill="#6d5b42">S3 ↔ C5: TX to RX, RX to TX, shared GND; 3.3 V logic only. Never connect 5 V to a GPIO.</text>
<text x="87" y="950" font-size="18" fill="#6d5b42">Mic VDD = regulated 3.3 V; amplifier VIN = verified rated supply. All grounds common; speaker SPK− never to GND.</text>
<text x="87" y="974" font-size="16" fill="#7c6c57">I²S and UART GPIO numbers, exact rail segments and breadboard row positions will be finalized after inspecting the Freenove pinout.</text>
</g></svg>